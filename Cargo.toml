[package]
name = "concord"
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Compare JavaScript and TypeScript linters and formatters"
license = "MIT"
repository = "https://github.com/ruidosujeira/Concord"
homepage = "https://github.com/ruidosujeira/Concord"
readme = "README.md"
default-run = "concord"

[features]
default = []
test-support = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
command-group = "5.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
globset = "0.4"
# 0.4.30 requires language features newer than Concord's Rust 1.85 MSRV.
ignore = "=0.4.29"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
predicates = "3.1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }

[[bin]]
name = "concord"
path = "src/main.rs"

[[bin]]
name = "concord-fake-tool"
path = "src/bin/concord-fake-tool.rs"
required-features = ["test-support"]
