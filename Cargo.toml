[package]
name = "concord"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Compare JavaScript and TypeScript linters and formatters"
license = "MIT"
repository = "https://github.com/ruidosujeira/Concord"
homepage = "https://github.com/ruidosujeira/Concord"
readme = "README.md"
default-run = "concord"

[features]
default = []
test-support = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
command-group = "5.0"
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "concord"
path = "src/main.rs"

[[bin]]
name = "concord-fake-tool"
path = "src/bin/concord-fake-tool.rs"
required-features = ["test-support"]
